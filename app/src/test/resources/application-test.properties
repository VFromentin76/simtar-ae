# ----------------------------------------
# PROPERTIES TEST
# ----------------------------------------

# ----------------------------------------
# CORE PROPERTIES
# ----------------------------------------
# LOGGING
logging.config=classpath:logback-spring-test.xml

# ----------------------------------------
# WEB PROPERTIES
# ----------------------------------------
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
# Display name of the sample.
server.servlet.application-display-name=@project.parent.artifactId@
# Server HTTP port.
server.port=8181
# Context path of the application.
server.servlet.context-path=/@project.parent.artifactId@
# Path of the main dispatcher servlet.
spring.mvc.servlet.path=/

server.jetty.accesslog.filename=./logs-test/test_jetty_access.log

# ----------------------------------------
# DATASOURCE PROPERTIES
# ----------------------------------------
spring.datasource.tomcat.validation-query=select 1 from INFORMATION_SCHEMA.SYSTEM_USERS

# ----------------------------------------
# JPA PROPERTIES
# ----------------------------------------
spring.jpa.generate-ddl=true
spring.data.jpa.repositories.enabled=true

# ----------------------------------------
# SECURITY CONFIGURATION
# ----------------------------------------
security.authentication.jwt.secret=my-secret-token-for-test
# Token is valid 24 hours
security.authentication.jwt.tokenValidityInSeconds=86400
#security.basic.enabled=false
# LDAP configuration
#security.ldapConfig.enabled=false
# Specifier le compte de service dedie a l'application
spring.ldap.username=testConnexion
spring.ldap.password=testPasswordConnexion
# Definition des roles specifiques a l'application
security.rolesConfig.projectRoles=AUTHENTICATED
security.enable-csrf=false

# ----------------------------------------
# ACTUATOR PROPERTIES
# ----------------------------------------
# Groupe AD pour l'acces aux endpoints actuator sensibles
security.rolesConfig.actuatorRoles=AUTHENTICATED

# ----------------------------------------
# COMPLEMENTARY MANAGEMENT WS
# ----------------------------------------
info.app.custom.projectCode=APP_TEST

