# ----------------------------------------
# ACTUATOR PROPERTIES
# ----------------------------------------
# Groupe AD pour l'acces aux endpoints actuator sensibles
security.rolesConfig.actuatorRoles=[GROUPE_LDAP_ACTUATOR]

# ----------------------------------------
# CORE PROPERTIES
# ----------------------------------------
# LOGGING
# Location of the logging configuration file. For instance "classpath:logback.xml" for Logback
logging.config=file:config/logback-spring.xml

# ----------------------------------------
# COMPLEMENTARY MANAGEMENT WS
# ----------------------------------------
info.app.custom.projectName=@project.parent.artifactId@
info.app.custom.projectDesc=@project.parent.description@
info.app.custom.projectVersion=@project.parent.version@
info.app.custom.environment=${server.exec.environment}
info.app.custom.hostname=${server.exec.hostname}
info.app.custom.serverPort=${server.port}


# ---- Configuration KeycloakProvider
hm.keycloak.url=[KCK_SERVER_URL]

#----------
# Soprano properties
#----------

external.api.soprano-configurateur.url=[SOPRANO_ENDPOINT]
external.api.soprano-configurateur.connectTimeout=5000
external.api.soprano-configurateur.readTimeout=10000

external.api.soprano-configurateur.authentification.royaume=[KCK_REALM]
external.api.soprano-configurateur.authentification.scope=openid
external.api.soprano-configurateur.authentification.grant_type=client_credentials
external.api.soprano-configurateur.authentification.client_id=[KCK_CLIENT_ID]
external.api.soprano-configurateur.authentification.client_secret=[KCK_CLIENT_SECRET]
