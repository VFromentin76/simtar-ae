# ----------------------------------------
# PROPERTIES LIV
# ----------------------------------------
spring.application.name=@project.parent.artifactId@
# ----------------------------------------
# WEB PROPERTIES
# ----------------------------------------
# EMBEDDED SERVER CONFIGURATION (ServerProperties)
# Display name of the sample.
server.servlet.application-display-name=@project.parent.artifactId@
# Server HTTP port.
server.port=8080
# Context path of the application.
server.servlet.context-path=/@project.parent.artifactId@
# Path of the main dispatcher servlet.
spring.mvc.servlet.path=/


# ----------------------------------------
# DATASOURCE PROPERTIES
# ----------------------------------------
# Datasource configuration (useless as HSQLDB is used)
#     - Example for Postgres
#spring.datasource.url=jdbc:postgresql://[SERVEUR_BASE]:[SERVEUR_BASE_PORT]/[BASE_NOM]
#spring.datasource.name=[BASE_NOM]
#spring.datasource.username=[BASE_USERNAME]
#spring.datasource.password=[BASE_PASSWORD]
#spring.datasource.driver-class-name=org.postgresql.Driver
#     - Example for Oracle
#spring.datasource.url=jdbc:oracle:thin:@//[SERVEUR_BASE]:[SERVEUR_BASE_PORT]/[BASE_NOM]
#spring.datasource.name=[BASE_NOM]
#spring.datasource.username=[BASE_USERNAME]
#spring.datasource.password=[BASE_PASSWORD]
#spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

# Determination de la taille du pool de connexions HikariCP.
# Permet de surcharger la valeur par defaut (10) fournie par le fwk Springboot, par une valeur adaptee a l application, avec les DBA.
# spring.datasource.hikari.maximumPoolSize=[HIKARI_MAX_POOL_SIZE]

# ----------------------------------------
# JPA PROPERTIES
# ----------------------------------------
# Disable feature detection by this undocumented parameter. Check the org.hibernate.engine.jdbc.internal.JdbcServiceImpl.configure method for more details.
#spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false

# JPA configuration exemples for :
#     - Postgres database
#spring.jpa.database=POSTGRESQL
#spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Because detection is disabled you have to set correct dialect by hand.
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#     - Oracle database
#spring.jpa.database=ORACLE
#spring.jpa.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
# Because detection is disabled you have to set correct dialect by hand.
#spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect

#  Configuration avancée
#spring.jpa.show_sql=true
#spring.jpa.hibernate.cache.use_second_level_cache=false
#spring.jpa.hibernate.cache.use_query_cache=false
#spring.jpa.hibernate.generate_statistics=false
#spring.jpa.hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
spring.data.jpa.repositories.enabled=true
# ----------------------------------------
# SECURITY CONFIGURATION
# ----------------------------------------
security.authentication.jwt.secret=[JWT_SECRET_KEY]
# Token is valid 24 hours
security.authentication.jwt.tokenValidityInSeconds=[JWT_TOKEN_VALIDITY_SECONDS]
# LDAP configuration

# definit par le framework : spring.ldap.urls=ldap://[LDAP_SERVER]:[LDAP_PORT]
spring.ldap.username=[LDAP_USER]
spring.ldap.password=[LDAP_PASSWORD]

# Definition des roles specifiques a l application
security.rolesConfig.projectRoles=[ROLES_APPLICATIFS]
security.enable-csrf=false

# ----------------------------------------
# COMPLEMENTARY MANAGEMENT WS
# ----------------------------------------
info.app.custom.projectCode=MANDATORY:CODE APP CARTO

