# ----------------------------------------
# SECURITY CONFIGURATION
# ----------------------------------------
# ---- Configuration LdapProvider

security.authentication.jwt.secret=my-secret-token-for-@project.parent.artifactId@-should-be-512-bits-size-and-change-for-production
# Token is valid 24 hours
security.authentication.jwt.tokenValidityInSeconds=86400
# LDAP configuration
# Specifier le compte de service dedie a l'application
spring.ldap.username=[LDAP_USER]
spring.ldap.password=[LDAP_PASSWORD]
# Definition des roles specifiques a l'application
security.rolesConfig.projectRoles=AUTHENTICATED
security.enable-csrf=false

# ----------------------------------------
# COMPLEMENTARY MANAGEMENT WS
# ----------------------------------------
info.app.custom.projectCode=MANDATORY:CODE APP CARTO

# ----------------------------------------
# SPRING DEVTOOLS CONFIGURATION
# ----------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false

